# Weekly free-tier usage report for sleuth-prod (N9): video storage, database size, guest and
# signed-up projects, analyses in the last 7 days. Read-only queries; numbers only in the output.
# Fails above 70% of the 1 GB storage or the 500 MB database, so GitHub emails the repo owner.
name: usage-watch

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

concurrency:
  group: usage-watch
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'Tauwho/Sleuth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Usage of sleuth-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --silent tsx scripts/usage-watch.ts
